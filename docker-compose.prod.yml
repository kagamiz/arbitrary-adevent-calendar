version: '3.8'

services:
  advent-calendar-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    env_file: .env
    volumes:
      - ./backend:/app
      - advent_calendar_data:/app/data
    networks:
      - proxy-network
    restart: unless-stopped

  advent-calendar-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_FRONTEND_URL: ${FRONTEND_URL}
        VITE_CALENDAR_NAME: ${VITE_CALENDAR_NAME}
    expose:
      - "80"
    env_file: .env
    environment:
      - VIRTUAL_HOST=jb-advcal2025-17th-anniv.miz-miz.biz
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=jb-advcal2025-17th-anniv.miz-miz.biz
      - LETSENCRYPT_EMAIL=admin@miz-miz.biz
    depends_on:
      - advent-calendar-backend
    networks:
      - proxy-network
    restart: unless-stopped

  sqlite:
    image: alpine:latest
    command: sh -c "apk add --no-cache sqlite && sleep infinity"
    volumes:
      - ./backend:/db
      - advent_calendar_data:/db/data
    networks:
      - proxy-network
    restart: unless-stopped

networks:
  proxy-network:
    external: true

volumes:
  advent_calendar_data:
