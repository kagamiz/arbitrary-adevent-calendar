version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    networks:
      - advent-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_CALENDAR_NAME: ${VITE_CALENDAR_NAME}
    ports:
      - "3000:80"
    env_file: .env
    depends_on:
      - backend
    networks:
      - advent-network
    restart: unless-stopped

  sqlite:
    image: alpine:latest
    command: sh -c "apk add --no-cache sqlite && sleep infinity"
    volumes:
      - ./backend:/db
      - backend_data:/db/data
    networks:
      - advent-network
    restart: unless-stopped

networks:
  advent-network:
    driver: bridge

volumes:
  backend_data:
